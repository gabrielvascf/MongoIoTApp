services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: soil_monitoring
      SERVER_ADDR: 0.0.0.0:7878
    ports:
      - "127.0.0.1:7878:7878"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7878/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./html/dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy

  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://server:7878
    volumes:
      - ./scripts/loadtest.js:/scripts/loadtest.js:ro
    command: ["run", "/scripts/loadtest.js"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
