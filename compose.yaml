services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-soil_monitoring}
      SERVER_ADDR: 0.0.0.0:7878
    ports:
      - "127.0.0.1:7878:7878"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7878/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://server:7878
    volumes:
      - ./scripts/loadtest.js:/scripts/loadtest.js:ro
    command: ["run", "/scripts/loadtest.js"]
    depends_on:
      server:
        condition: service_healthy

  capacity-test:
    image: grafana/k6:0.54.0
    profiles: ["capacity"]
    environment:
      BASE_URL: http://server:7878
      MAX_DEVICES: ${MAX_DEVICES:-25}
      CAPACITY_RUN_ID: ${CAPACITY_RUN_ID:-local}
    volumes:
      - ./scripts/capacity-test.js:/scripts/capacity-test.js:ro
    command: ["run", "/scripts/capacity-test.js"]
    depends_on:
      server:
        condition: service_healthy

  hourly-wave-test:
    image: grafana/k6:0.54.0
    profiles: ["hourly-wave"]
    environment:
      BASE_URL: http://server:7878
      MAX_DEVICES: ${MAX_DEVICES:-25}
      HOURLY_RUN_ID: ${HOURLY_RUN_ID:-local-01}
    volumes:
      - ./scripts/hourly-wave-test.js:/scripts/hourly-wave-test.js:ro
    command: ["run", "/scripts/hourly-wave-test.js"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
